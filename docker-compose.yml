x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_DEFAULT_BINARY_DATA_MODE: database # filesystem mode is not supported with workers
  N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE_ACTIVATION_KEY:-} # Registered Community license (free); no effect once activated
  GENERIC_TIMEZONE: ${TZ}
  TZ: ${TZ}

services:
  postgres:
    image: postgres:${POSTGRES_TAG}
    command: ["postgres", "-c", "max_connections=1000"] # WAHA opens one database per session
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      WAHA_DB_PASSWORD: ${WAHA_DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro # runs only on an empty data dir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:${REDIS_TAG}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:${WAHA_TAG}
    ports: ["127.0.0.1:${WAHA_HOST_PORT}:3000"]
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha
      WHATSAPP_HOOK_EVENTS: message.any
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Waha-Webhook-Secret:${WAHA_WEBHOOK_SECRET} # n8n Webhook node checks this header (Header Auth)
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USER}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_SESSIONS_POSTGRESQL_URL: postgres://waha:${WAHA_DB_PASSWORD}@postgres:5432/waha?sslmode=disable
      WAHA_MEDIA_STORAGE: POSTGRESQL
      WAHA_MEDIA_POSTGRESQL_URL: postgres://waha:${WAHA_DB_PASSWORD}@postgres:5432/waha?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:${N8N_TAG}
    ports: ["127.0.0.1:5678:5678"]
    environment:
      <<: *n8n-env
      N8N_SECURE_COOKIE: "false" # local only (plain http)
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_PUBLIC_API_DISABLED: "false"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows # versioned workflow JSON (n8n export/import)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  n8n-worker:
    image: n8nio/n8n:${N8N_TAG}
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    environment:
      <<: *n8n-env
    volumes:
      - ./n8n-data:/home/node/.n8n # community nodes must exist on the worker too
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    stop_grace_period: 60s
    restart: unless-stopped
